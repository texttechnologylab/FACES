<!--
  Partners & funding strip.

  Real logos live in docs/assets/logos/. Remaining placeholders render as a
  dashed box; to swap one in, replace

      <span class="logo--placeholder">Goethe-Universität<small>logo placeholder</small></span>

  with

      <img src="{{ 'assets/logos/goethe.svg' | url }}" alt="Goethe University Frankfurt">

  and drop the file alongside the others.
-->
<section class="faces-funders">
  <div class="faces-funders__inner">
    <p class="faces-funders__label">Partners &amp; funding</p>
    <div class="faces-funders__row">

      <a href="https://www.uni-frankfurt.de/" title="Goethe University Frankfurt">
        <span class="logo--placeholder">Goethe-Universität<small>logo placeholder</small></span>
      </a>

      <a href="https://www.texttechnologylab.org/" title="Text Technology Lab">
        <img src="{{ 'assets/logos/ttlab.png' | url }}" alt="Text Technology Lab">
      </a>

      <a href="https://www.lifbi.de/" title="Leibniz Institute for Educational Trajectories">
        <img src="{{ 'assets/logos/lifbi.png' | url }}" alt="Leibniz Institute for Educational Trajectories">
      </a>

      <a href="https://gepris.dfg.de/gepris/projekt/539621548?language=en" title="Deutsche Forschungsgemeinschaft">
        <img src="{{ 'assets/logos/dfg.jpg' | url }}" alt="Deutsche Forschungsgemeinschaft">
      </a>

      <a href="https://www.new-data-spaces.de/en-us/" title="SPP 2431 New Data Spaces">
        <img src="{{ 'assets/logos/spp2431.png' | url }}" alt="SPP 2431 New Data Spaces">
      </a>

    </div>
  </div>
